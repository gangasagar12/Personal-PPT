<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.8" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glowLeft" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRight" cx="80%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
    </pattern>

    <!-- Subtle Dots -->
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(56, 189, 248, 0.15)" />
    </pattern>
  </defs>

  <!-- Base Rectangle -->
  <rect width="1600" height="600" fill="url(#bgGrad)" />

  <!-- Ambient Glows -->
  <rect width="1600" height="600" fill="url(#glowLeft)" />
  <rect width="1600" height="600" fill="url(#glowRight)" />

  <!-- Grid Overlay -->
  <rect width="1600" height="600" fill="url(#grid)" />
  <rect width="1600" height="600" fill="url(#dots)" opacity="0.7" />

  <!-- Abstract Tech Wave Lines -->
  <path d="M -100 480 C 300 320, 600 560, 1000 420 C 1300 320, 1500 460, 1700 380" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" opacity="0.35" />
  <path d="M -100 520 C 250 380, 700 590, 1100 450 C 1400 360, 1550 490, 1700 430" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="6,8" opacity="0.25" />
  <path d="M -50 250 C 350 150, 750 340, 1150 220 C 1350 160, 1500 240, 1650 200" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.2" />

  <!-- Constellation Nodes & Connections -->
  <g opacity="0.4" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1">
    <line x1="240" y1="180" x2="380" y2="120" />
    <line x1="380" y1="120" x2="480" y2="210" />
    <line x1="480" y1="210" x2="340" y2="280" />
    <line x1="340" y1="280" x2="240" y2="180" />

    <line x1="1200" y1="160" x2="1340" y2="220" />
    <line x1="1340" y1="220" x2="1420" y2="140" />
    <line x1="1420" y1="140" x2="1280" y2="100" />
    <line x1="1280" y1="100" x2="1200" y2="160" />
  </g>

  <!-- Node Dots -->
  <g fill="#38bdf8">
    <circle cx="240" cy="180" r="3.5" opacity="0.8" />
    <circle cx="380" cy="120" r="4.5" opacity="0.9" />
    <circle cx="480" cy="210" r="3" opacity="0.7" />
    <circle cx="340" cy="280" r="4" opacity="0.8" />

    <circle cx="1200" cy="160" r="4" opacity="0.8" />
    <circle cx="1340" cy="220" r="4.5" opacity="0.9" />
    <circle cx="1420" cy="140" r="3" opacity="0.7" />
    <circle cx="1280" cy="100" r="3.5" opacity="0.8" />
  </g>
</svg>

