<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="100%" height="100%">
  <defs>
    <!-- Background Deep Tech Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.9" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glowLeft" cx="15%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRight" cx="85%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.2" />
    </pattern>

    <!-- Subtle Dots -->
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="rgba(56, 189, 248, 0.28)" />
    </pattern>
  </defs>

  <!-- Base Rectangle -->
  <rect width="1600" height="600" fill="url(#bgGrad)" />

  <!-- Ambient Glows -->
  <rect width="1600" height="600" fill="url(#glowLeft)" />
  <rect width="1600" height="600" fill="url(#glowRight)" />

  <!-- Grid & Tech Matrix Overlays -->
  <rect width="1600" height="600" fill="url(#grid)" />
  <rect width="1600" height="600" fill="url(#dots)" opacity="0.8" />

  <!-- Circuit & Architecture Data Traces -->
  <g stroke="rgba(56, 189, 248, 0.45)" stroke-width="1.5" fill="none">
    <path d="M 0 150 L 280 150 L 360 230 L 720 230" />
    <path d="M 280 150 L 320 110 L 560 110" />
    <path d="M 1600 450 L 1320 450 L 1240 370 L 980 370" />
    <path d="M 1320 450 L 1280 490 L 1050 490" />
    <path d="M 80 500 L 220 500 L 300 420 L 520 420" />
    <path d="M 1520 120 L 1380 120 L 1300 200 L 1120 200" />
  </g>

  <!-- Glowing Connection Nodes -->
  <g fill="#38bdf8">
    <circle cx="280" cy="150" r="4.5" />
    <circle cx="360" cy="230" r="4" />
    <circle cx="720" cy="230" r="5" />
    <circle cx="320" cy="110" r="4" />
    <circle cx="560" cy="110" r="4.5" />
    <circle cx="1320" cy="450" r="4.5" />
    <circle cx="1240" cy="370" r="4" />
    <circle cx="980" cy="370" r="5" />
    <circle cx="1280" cy="490" r="4" />
    <circle cx="1050" cy="490" r="4.5" />
    <circle cx="300" cy="420" r="4" />
    <circle cx="1300" cy="200" r="4" />
  </g>

  <!-- Abstract Tech Wave Ribbon -->
  <path d="M -100 480 C 300 300, 600 560, 1000 400 C 1300 280, 1500 440, 1700 360" fill="none" stroke="url(#accentGrad)" stroke-width="3" opacity="0.5" />
  <path d="M -100 520 C 250 360, 700 580, 1100 430 C 1400 320, 1550 470, 1700 410" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8,8" opacity="0.35" />
</svg>
