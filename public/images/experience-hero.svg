<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="100%" height="100%">
  <defs>
    <!-- Background Deep Tech Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#14213d" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="brandAccentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4B86A5" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.9" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glowLeft" cx="20%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#4B86A5" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRight" cx="80%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Technical Grid Pattern -->
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.2" />
    </pattern>

    <!-- Subtle Tech Dots -->
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.3" fill="rgba(75, 134, 165, 0.25)" />
    </pattern>
  </defs>

  <!-- Base Rectangle -->
  <rect width="1600" height="600" fill="url(#bgGrad)" />

  <!-- Ambient Glows -->
  <rect width="1600" height="600" fill="url(#glowLeft)" />
  <rect width="1600" height="600" fill="url(#glowRight)" />

  <!-- Grid & Tech Matrix Overlays -->
  <rect width="1600" height="600" fill="url(#grid)" />
  <rect width="1600" height="600" fill="url(#dots)" opacity="0.8" />

  <!-- Career Roadmap Traces (Milestones & Trajectories) -->
  <g stroke="rgba(75, 134, 165, 0.45)" stroke-width="1.5" fill="none">
    <path d="M 0 200 L 220 200 L 320 280 L 640 280" />
    <path d="M 220 200 L 280 140 L 520 140" />
    <path d="M 1600 400 L 1360 400 L 1260 320 L 960 320" />
    <path d="M 1360 400 L 1300 460 L 1080 460" />
    <path d="M 100 480 L 260 480 L 360 380 L 580 380" />
    <path d="M 1500 160 L 1340 160 L 1240 240 L 1020 240" />
  </g>

  <!-- Glowing Career Milestone Nodes -->
  <g fill="#38bdf8">
    <circle cx="220" cy="200" r="4.5" />
    <circle cx="320" cy="280" r="4" />
    <circle cx="640" cy="280" r="5" />
    <circle cx="280" cy="140" r="4" />
    <circle cx="520" cy="140" r="4.5" />
    <circle cx="1360" cy="400" r="4.5" />
    <circle cx="1260" cy="320" r="4" />
    <circle cx="960" cy="320" r="5" />
    <circle cx="1300" cy="460" r="4" />
    <circle cx="1080" cy="460" r="4.5" />
    <circle cx="360" cy="380" r="4" />
    <circle cx="1240" cy="240" r="4" />
  </g>

  <!-- Career Trajectory Ribbon -->
  <path d="M -100 450 C 320 260, 620 520, 1020 360 C 1320 250, 1520 420, 1700 330" fill="none" stroke="url(#brandAccentGrad)" stroke-width="2.5" opacity="0.45" />
  <path d="M -100 490 C 260 320, 720 540, 1120 390 C 1420 290, 1560 440, 1700 380" fill="none" stroke="#4B86A5" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.35" />
</svg>